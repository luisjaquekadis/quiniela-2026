name: Quiniela Auto-Updater

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Updater Script
        run: |
          cd quiniela-mundial
          python3 github_cron_updater.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add quiniela-mundial/api/2026.json
          git commit -m "Auto-update official scores from ESPN" || echo "No changes to commit"
          git push || echo "No changes to push"
